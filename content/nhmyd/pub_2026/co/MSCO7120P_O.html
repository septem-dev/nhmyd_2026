	$(document).ready(function () {
		popCenter();
	})

<body>
<div class="wrapper nhasset"><!-- 바닥페이지 --></div>

<!-- [팝업] Message 팝업  -->
<div class="nhasset popWrap centerLayer" role="dialog">
	<div class="dim"></div>
	<div class="dimCloseArea" role="button" tabindex="0" onclick="popClose(this);return false;">터치 시 해당 창을 닫습니다.</div>
	<div class="popInner investLayer">
		<div class="popCont">
			<div class="confirmMsg type05"> <!-- [수정 260805] [MD2607_082] 홈화면 나만의 메뉴에 자산연결 아이콘 추가 : class="type05" 추가 -->
				<p class="tit"><span class="name">$성명$</span>님의 투자자성향은 <br><span class="diag grade2">적극투자형</span>입니다.</p> <!-- [D] 공격투자형 : grade1 / 적극투자형 : grade2 /  위험중립형 : grade3 / 안정추구형 : grade4 / 안정형 : grade5 -->
				<p>재산 상황, 가입 목적, 투자 경험 등 투자자 정보가 변경된 경우 투자자성향을 다시 진단해 주세요.</p>
				<p>투자자 보호를 위해 일반금융소비자로 진행됩니다. 전문금융소비자*는 영업점에서 상담 또는 가입할 수 있습니다.</p>
				
				<!-- [위치변경 260805] [MD2607_082] 홈화면 나만의 메뉴에 자산연결 아이콘 추가 -->
				<div class="confirmDesc">
					* 전문금융소비자란? <br>
					「금융소비자 보호에 관련 법률」 제2조 제9호에 따라 금융상품에 관한 전문성 또는 소유 자산 규모 등에 비추어 금융상품 계약에 따른 위험 감수 능력이 있는 금융소비자
				</div>
				<!-- //[위치변경 260805] [MD2607_082] 홈화면 나만의 메뉴에 자산연결 아이콘 추가 -->
			</div>
		</div>

		<div class="popBtnWrap">
			<div class="popBtn half">
				<a href="javascript:;" onclick="popClose(this);return false;" role="button">성향진단<br>다시하기</a>
				<a href="javascript:;" class="confirmBtn" onclick="popClose(this);return false;" role="button">기존성향<br>유지하기</a>
			</div>
		</div>
	</div>
</div>
<!-- // -->
