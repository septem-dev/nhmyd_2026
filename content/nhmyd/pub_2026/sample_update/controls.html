<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Controls | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Controls</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">stepper</h2>
                <div class="demo row">
                    <div class="controls-stepper">
                        <button type="button" class="controls-stepper__btn" aria-label="감소" disabled></button>
                        <input type="text" class="controls-stepper__input" value="0" inputmode="numeric" />
                        <button type="button" class="controls-stepper__btn" aria-label="증가"></button>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">controller — previous / next (default / disabled)</h2>
                <div class="demo row">
                    <button type="button" class="controls-controller" aria-label="이전"></button>
                    <button type="button" class="controls-controller" aria-label="다음"></button>
                    <button type="button" class="controls-controller" aria-label="이전" disabled></button>
                    <button type="button" class="controls-controller" aria-label="다음" disabled></button>
                </div>
            </div>
        </div>
    </body>
</html>
