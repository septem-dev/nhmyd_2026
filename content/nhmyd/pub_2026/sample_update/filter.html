<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Filter | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Filter</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">left — 텍스트+아이콘 / 툴팁+스위치</h2>
                <p class="note">left/right 모두 상단 8px 콘텐츠 구분선, 하단 1px 페이지 구분선을 옵션으로 붙일 수 있습니다.</p>
                <div class="demo">
                    <div class="filter-left">
                        <div class="filter-left__text">
                            <span class="filter-left__label">최신순ㆍ3개월</span>
                            <span class="filter-left__icon" aria-hidden="true"></span>
                        </div>
                        <div class="filter-left__tooltip">
                            <span class="filter-left__tooltip-text">
                                추천 상품
                                <span class="filter-left__tooltip-icon" aria-hidden="true"></span>
                            </span>
                            <label class="switch switch--xs">
                                <input type="checkbox" class="switch__input" />
                                <span class="switch__track" aria-hidden="true"></span>
                                <span class="blind">추천 상품 필터</span>
                            </label>
                        </div>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">right — 날짜+정렬 텍스트 / 아이콘</h2>
                <div class="demo">
                    <div class="filter-right">
                        <div class="filter-right__text">
                            <span class="filter-right__date">2024.01.01~2024.03.01</span>
                            <span class="filter-right__sort">최신순</span>
                        </div>
                        <span class="filter-right__icon" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
