<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>Textarea-message | UI Guide</title>
    </head>
    <body>
        <div class="wrapper nhasset nds">
            <!-- header -->
            <div class="header">
                <a href="javascript:;" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>Textarea-message</h1>
            </div>
            <!-- //header -->
            <div class="container">
                <h2 class="guide-title">Basic — Inactive</h2>
                <div class="demo">
                    <div class="textarea" style="width:312px;">
                        <span class="textarea__label">레이블</span>
                        <div class="textarea__wrap">
                            <textarea class="textarea__field" placeholder="내용을 입력하세요"></textarea>
                            <button type="button" class="textarea__clear" aria-label="입력 내용 지우기"></button>
                        </div>
                        <div class="textarea__footer">
                            <span class="textarea__msg">안내 문구 입력</span>
                            <span class="textarea__count">
                                <span class="textarea__count-current">0</span>
                                / 50
                            </span>
                        </div>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic — Focus</h2>
                <div class="demo">
                    <div class="textarea textarea--focus" style="width:312px;">
                        <span class="textarea__label">레이블</span>
                        <div class="textarea__wrap">
                            <textarea class="textarea__field">입력된 텍스트 입니다</textarea>
                            <button type="button" class="textarea__clear" aria-label="입력 내용 지우기"></button>
                        </div>
                        <div class="textarea__footer">
                            <span class="textarea__msg">안내 문구 입력</span>
                            <span class="textarea__count">
                                <span class="textarea__count-current">11</span>
                                / 50
                            </span>
                        </div>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic — Filled</h2>
                <div class="demo">
                    <div class="textarea textarea--filled" style="width:312px;">
                        <span class="textarea__label">레이블</span>
                        <div class="textarea__wrap">
                            <textarea class="textarea__field">입력된 텍스트 입니다</textarea>
                        </div>
                        <div class="textarea__footer">
                            <span class="textarea__msg">안내 문구 입력</span>
                            <span class="textarea__count">
                                <span class="textarea__count-current">11</span>
                                / 50
                            </span>
                        </div>
                    </div>
                </div>

                <hr class="divider" />

                <h2 class="guide-title">Basic — Error</h2>
                <div class="demo">
                    <div class="textarea textarea--error" style="width:312px;">
                        <span class="textarea__label">레이블</span>
                        <div class="textarea__wrap">
                            <textarea class="textarea__field">입력된 텍스트 입니다</textarea>
                        </div>
                        <div class="textarea__footer">
                            <span class="textarea__msg">오류 메세지 출력</span>
                            <span class="textarea__count">
                                <span class="textarea__count-current">11</span>
                                / 50
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
