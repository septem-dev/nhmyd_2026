<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] AI 포트폴리오 진단 다시하기</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm" role="dialog" aria-modal="true" aria-labelledby="popTitle">
            <div class="dim"></div>
            <div class="popInner">
                <h1 id="popTitle" class="blind">투자성향진단 결과</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="text-stack invest">
                            <p class="text--h1">
                                투자성향을 다시
                                <br />
                                진단 받으시겠어요?
                            </p>
                            <div>
                                <p class="text--body1-medium text--font3">
                                    고객님의 현재 투자성향에 맞춰 더 정확한 진단과<br />
                                    제안을 해드릴 수 있어요. 유지하시면,<br />
                                    예전 투자성향을 사용해요.
                                </p>
                                <p class="stack-visual right">
                                    <img class="illust" src="../../images/update/img-ally-picture-frame.png" width="180" height="130" alt="" />
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn half">
                        <a href="javascript:;" onclick="popClose(this);return false;" class="btnPressDefault" role="button">유지</a>
                        <a href="javascript:;" class="confirmBtn" role="button">투자성향 진단</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
