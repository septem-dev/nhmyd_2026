<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산/부채 통합 진단 서비스 이용동의</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>자산/부채 통합 진단 서비스 이용동의</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="terms-card">
                            <div class="terms-card__header">
                                <div class="terms-card__check">
                                    <label class="check-basic">
                                        <input type="checkbox" class="check-basic__input" />
                                        <span class="check-basic__icon" aria-hidden="true"></span>
                                        <span class="terms-card__title">[필수] 전체 동의</span>
                                    </label>
                                </div>
                                <button type="button" class="terms-card__toggle" aria-label="약관 상세로 이동"></button>
                            </div>
                            <hr class="terms-card__divider" />
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" data-agree-required="terms" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">NH마이데이터 「자산/부채 통합 진단」 서비스 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" data-agree-required="terms" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>

                        <div class="terms-card">
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] OOO 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn disabled" data-agree-button="terms" role="button" aria-disabled="true">시작하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>

        <!-- 필수 약관 동의 → 버튼 활성화는 공통 js/update-ui.js에서 처리 (data-agree-required / data-agree-button) -->
    </body>
</html>
