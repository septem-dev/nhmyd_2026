<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산/부채 통합 분석_소득/소비정보 등록</title>
        <script>
            $(document).ready(function () {
            	slidePopConfirm();
            })
        </script>
    </head>

    <body>
        <div class="wrapper nhasset nds"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>수입•지출 정보 입력</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <div class="stack--32">
                            <div class="radio-box-field">
                                <p class="text--h4">월 소득이 어떻게 되나요.</p>
                                <div class="radio-box-group">
                                    <div class="radio-survey__options">
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-1" class="radio-hidden-input radio-box-input" />
                                            <span class="radio-box is-sm is-center">150만원 미만</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-2" class="radio-hidden-input radio-box-input" checked />
                                            <span class="radio-box is-sm is-center">150~300만원</span>
                                        </label>
                                    </div>
                                    <div class="radio-survey__options">
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-3" class="radio-hidden-input radio-box-input" />
                                            <span class="radio-box is-sm is-center">300~500만원</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-4" class="radio-hidden-input radio-box-input" />
                                            <span class="radio-box is-sm is-center">500~800만원</span>
                                        </label>
                                    </div>
                                    <div class="radio-survey__options">
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-5" class="radio-hidden-input radio-box-input" />
                                            <span class="radio-box is-sm is-center">800~1,000만원</span>
                                        </label>
                                        <label>
                                            <input type="radio" name="coIncome" id="coIncome-6" class="radio-hidden-input radio-box-input" />
                                            <span class="radio-box is-sm is-center">1,000만원 이상</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="stack--12">
                                <div class="income-consume__title tooltipWrap">
                                    <p class="text--h4">매월 얼마나 소비하고 있나요.</p>
                                    <a href="javascript:;" class="toolTipBtn" onclick="tooltipOpen($(this));return false;" role="button"><span class="blind">소비금액 산정 기준 안내 보기</span></a>
                                    <div class="tooltipCont" style="display: none">
                                        <h3>지난달 소비금액</h3>
                                        <ul>
                                            <li>지난달 카드이용내역, 현금영수증 발행내역 및 계좌이체나 현금으로 소비 등록한 내역에 대한 합계 금액이에요.</li>
                                        </ul>
                                        <a href="javascript:;" class="close" onclick="tooltipClose($(this));return false;" role="button"><span class="blind">닫기</span></a>
                                    </div>
                                </div>
                                <div class="radio-survey__options">
                                    <label>
                                        <input type="radio" name="coConsumeQuick1" id="coConsumeQuick1-10" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+10만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick1" id="coConsumeQuick1-50" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+50만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick1" id="coConsumeQuick1-100" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+100만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick1" id="coConsumeQuick1-300" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+300만원</span>
                                    </label>
                                </div>
                                <div class="input-box">
                                    <div class="input-box__field won">
                                        <input type="text" inputmode="numeric" class="input-box__input is-right" value="128" readonly />
                                        <span class="input-box__unit">만원</span>
                                    </div>
                                    <p class="input-box__message is-success">일백이십팔만원</p>
                                </div>
                            </div>

                            <div class="stack--12">
                                <div class="income-consume__title tooltipWrap">
                                    <p class="text--h4">매월 얼마나 소비하고 있나요.</p>
                                    <a href="javascript:;" class="toolTipBtn" onclick="tooltipOpen($(this));return false;" role="button"><span class="blind">소비금액 산정 기준 안내 보기</span></a>
                                    <div class="tooltipCont" style="display: none">
                                        <h3>지난달 소비금액</h3>
                                        <ul>
                                            <li>지난달 카드이용내역, 현금영수증 발행내역 및 계좌이체나 현금으로 소비 등록한 내역에 대한 합계 금액이에요.</li>
                                        </ul>
                                        <a href="javascript:;" class="close" onclick="tooltipClose($(this));return false;" role="button"><span class="blind">닫기</span></a>
                                    </div>
                                </div>
                                <div class="radio-survey__options">
                                    <label>
                                        <input type="radio" name="coConsumeQuick2" id="coConsumeQuick2-10" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+10만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick2" id="coConsumeQuick2-50" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+50만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick2" id="coConsumeQuick2-100" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+100만원</span>
                                    </label>
                                    <label>
                                        <input type="radio" name="coConsumeQuick2" id="coConsumeQuick2-300" class="radio-hidden-input radio-box-input" />
                                        <span class="radio-box is-xs is-center">+300만원</span>
                                    </label>
                                </div>
                                <div class="input-box is-error">
                                    <div class="input-box__field">
                                        <input type="text" inputmode="numeric" class="input-box__input" placeholder="최소 1만원 이상" value="" />
                                        <span class="input-box__unit">만원</span>
                                    </div>
                                    <p class="input-box__message">최소 금액 1만원 이상 입력해주세요.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="confirmBtn disabled" role="button" aria-disabled="true">입력하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button"><img src="../../images/common/btn_popClose.png" alt="닫기" /></a>
                </div>
            </div>
        </div>
    </body>
</html>
