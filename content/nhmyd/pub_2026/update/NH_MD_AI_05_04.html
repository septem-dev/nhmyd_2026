<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산진단 횟수초과 안내</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>오늘 진단 횟수를 모두 사용했어요</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <p class="text--body2">
                            투자성향 진단은 하루에 3회까지 가능해요.
                            <br />
                            내일 다시 투자성향 진단을 사용하실 수 있어요.
                            <br />
                            최근 투자성향을 이용해 AI 포트폴리오를 진행할까요?
                        </p>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" role="button" class="btnPressDefault">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">AI 진단</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
