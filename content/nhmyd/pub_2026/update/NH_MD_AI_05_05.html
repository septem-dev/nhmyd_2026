<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 자산연결</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>자산연결</h1>
                <div class="popCont">
                    <div class="popCont__inner center">
                        <div class="text-stack">
                            <p class="text text--h2-regular">
                                <!-- prettier-ignore -->
                                <strong>자산</strong>을 연결해보세요!
                            </p>
                            <p class="text text--body2">
                                AI 포트폴리오 서비스 이용을 위해
                                <br />
                                자산연결이 필요해요.
                            </p>
                            <p class="stack-visual"><img src="../../images/update/img-ally-ai-laptop.png" width="160" height="130" alt="" /></p>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="btnPressDefault" role="button">다음에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">자산 연결하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
