<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] AI 포트폴리오</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm" role="dialog" aria-modal="true" aria-labelledby="popTitle">
            <div class="dim"></div>
            <div class="popInner">
                <h1 id="popTitle">AI 포트폴리오 서비스 이용동의</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <p class="text--body2">서비스 이용을 위해 동의가 필요해요.</p>
                        <div class="terms-card mt16">
                            <div class="terms-card__header">
                                <div class="terms-card__check">
                                    <label class="check-basic">
                                        <input type="checkbox" class="check-basic__input" id="agreeTerms0" />
                                        <span class="check-basic__icon"></span>
                                        <span class="terms-card__title">[필수] 전체 동의</span>
                                    </label>
                                </div>
                                <button type="button" class="terms-card__toggle" aria-label="약관 상세로 이동"></button>
                            </div>
                            <hr class="terms-card__divider" />
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" id="agreeTerms1" data-agree-required="terms" />
                                            <span class="check-basic__icon"></span>
                                            <span class="terms-link__text">NH마이데이터 AI 서비스 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" id="agreeTerms2" data-agree-required="terms" />
                                            <span class="check-basic__icon"></span>
                                            <span class="terms-link__text">NH마이데이터 「AI 포트폴리오」 서비스 이용약관</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>
                        <div class="terms-card">
                            <div class="terms-card__list">
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] 개인(신용)정보 수집·이용 동의서(상품 서비스 안내 등)</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                                <div class="terms-accordion" hidden>
                                    <label class="check-basic">
                                        <input type="checkbox" class="check-basic__input" />
                                        <span class="check-basic__icon" aria-hidden="true"></span>
                                        <span class="check-basic__label">전체선택</span>
                                    </label>
                                    <div class="terms-accordion__rows">
                                        <div class="terms-accordion__row">
                                            <label class="check-basic">
                                                <input type="checkbox" class="check-basic__input" checked />
                                                <span class="check-basic__icon" aria-hidden="true"></span>
                                                <span class="check-basic__label">전화</span>
                                            </label>
                                            <label class="check-basic">
                                                <input type="checkbox" class="check-basic__input" />
                                                <span class="check-basic__icon" aria-hidden="true"></span>
                                                <span class="check-basic__label">문자메세지</span>
                                            </label>
                                        </div>
                                        <div class="terms-accordion__row">
                                            <label class="check-basic">
                                                <input type="checkbox" class="check-basic__input" />
                                                <span class="check-basic__icon" aria-hidden="true"></span>
                                                <span class="check-basic__label">우편물</span>
                                            </label>
                                            <label class="check-basic">
                                                <input type="checkbox" class="check-basic__input" checked />
                                                <span class="check-basic__icon" aria-hidden="true"></span>
                                                <span class="check-basic__label">이메일</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="terms-link">
                                    <div class="terms-link__check">
                                        <label class="check-basic is-xs">
                                            <input type="checkbox" class="check-basic__input" />
                                            <span class="check-basic__icon" aria-hidden="true"></span>
                                            <span class="terms-link__text">[선택] 개인(신용)정보 수집·이용 동의서(상품 서비스 안내 등)(NH마이데이터)</span>
                                        </label>
                                    </div>
                                    <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" id="btnTermsConfirm" data-agree-button="terms" class="btnPressPoint confirmBtn disabled" role="button" aria-disabled="true">시작하기</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>

        <!-- 필수 약관 동의 → 버튼 활성화는 공통 js/update-ui.js에서 처리 (data-agree-required / data-agree-button) -->
    </body>
</html>
