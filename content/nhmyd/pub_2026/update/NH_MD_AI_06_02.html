<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>[P] 안전자산확보</title>
        <script>
            $(document).ready(function () {
                slidePopConfirm();
            });
        </script>
    </head>

    <body>
        <div class="wrapper nhasset"><!-- 바닥페이지 --></div>
        <div class="nhasset popWrap nds slidePopConfirm">
            <div class="dim"></div>
            <div class="popInner">
                <h1>만기가 지난 예&middot;적금이 있어요.</h1>
                <div class="popCont">
                    <div class="popCont__inner">
                        <p class="text text--body2">
                            투자를 제외한 목적이 있다면, 포트폴리오 제안 시,
                            <br />
                            안전 자산으로 확보 해둘까요?
                        </p>
                    </div>
                </div>
                <div class="popBtnWrap">
                    <div class="popBtn">
                        <a href="javascript:;" class="btnPressDefault" role="button">나중에</a>
                        <a href="javascript:;" class="confirmBtn" role="button">안전자산확보</a>
                    </div>
                    <a href="javascript:;" onclick="popClose(this);return false;" class="popClose" title="해당 창을 닫습니다." role="button">
                        <img src="../../images/common/btn_popClose.png" alt="닫기" />
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
