<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <script src="../pub-assets/js/head-mb-update.js"></script>
        <title>NH마이데이터 인트로</title>
    </head>

    <body>
        <div class="wrapper nhasset nds">
            <div class="header">
                <a href="javascript:;" role="button" class="btnBack"><span class="blind">이전화면으로</span></a>
                <h1>NH마이데이터</h1>
                <a href="javascript:;" class="btnGoHome" role="button"><span class="blind">Home</span></a>
            </div>

            <div class="container pb32">
                <div class="text-stack mb0">
                    <p class="text text--h2">
                        스마트한 금융생활의 시작
                        <br />
                        NH마이데이터와 함께해 보세요!
                        <span class="text text--caption mt4">준법감사인 심의필 2025-5973(2025.12.01~2026.11.18)</span>
                    </p>
                    <p class="stack-visual mt32 mb32">
                        <img src="../../images/update/img-ally-welcome-group.png" alt="" />
                    </p>
                </div>

                <div class="text-stack">
                    <p class="text text--body3 text--font3">NH마이데이터 서비스 가입 전 신중히 고민하고 필요한 서비스만 가입해주세요. 언제든지 해지할 수 있어요.</p>
                    <button type="button" class="btn-arrow" onclick="location.href='MSPS3120.html'">
                        <span>마이데이터 가입현황 확인</span>
                        <span class="btn-arrow__icon is-right" aria-hidden="true"></span>
                    </button>
                </div>

                <div class="text-stack mt32 mb0">
                    <div class="terms-card">
                        <div class="terms-card__header">
                            <div class="terms-card__check">
                                <label class="check-basic">
                                    <input type="checkbox" class="check-basic__input" />
                                    <span class="check-basic__icon" aria-hidden="true"></span>
                                    <span class="terms-card__title">[필수] 전체 동의</span>
                                </label>
                            </div>
                        </div>
                        <hr class="terms-card__divider" />
                        <div class="terms-card__list">
                            <div class="terms-link">
                                <div class="terms-link__check">
                                    <label class="check-basic is-xs">
                                        <input type="checkbox" class="check-basic__input" id="agreeTerms1" />
                                        <span class="check-basic__icon"></span>
                                        <span class="terms-link__text">[필수] NH마이데이터서비스 이용약관</span>
                                    </label>
                                </div>
                                <button type="button" class="terms-link__arrow" aria-label="상세보기" onclick="location.href='MSSB1003R.html'"></button>
                            </div>
                            <div class="terms-link">
                                <div class="terms-link__check">
                                    <label class="check-basic is-xs">
                                        <input type="checkbox" class="check-basic__input" id="agreeTerms2" />
                                        <span class="check-basic__icon"></span>
                                        <span class="terms-link__text">[필수] 개인(신용)정보 수집·이용 동의서 (NH 마이데이터 서비스)</span>
                                    </label>
                                </div>
                                <button type="button" class="terms-link__arrow" aria-label="상세보기"></button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn-arrow flex-end">
                        <span>개인정보처리방침</span>
                        <span class="btn-arrow__icon is-right" aria-hidden="true"></span>
                    </button>
                </div>

                <div class="input-box mt40">
                    <p class="input-box__label">권유직원(선택)</p>
                    <a href="javascript:;" class="input-box__field pr8">
                        <span class="input-box__ghost">이름 또는 사번을 입력하세요</span>
                        <span class="input-box__btn">직원찾기</span>
                    </a>
                </div>
            </div>
            <div class="areaBtnStatic">
                <a href="javascript:;" id="btnTermsConfirm" class="btnPressPoint disabled" role="button" aria-disabled="true">서비스 가입</a>
            </div>
        </div>

        <script>
            $(function () {
                var $requiredCard = $('.terms-card').eq(0);
                var $requiredChecks = $requiredCard.find('.terms-card__list .check-basic__input');
                var $requiredMaster = $requiredCard.find('.terms-card__header .check-basic__input');
                var $confirmBtn = $('.areaBtnStatic .btnPressPoint');

                function syncConfirmBtn() {
                    var enabled = $requiredChecks.length > 0 && $requiredChecks.filter(':checked').length === $requiredChecks.length;
                    $confirmBtn.toggleClass('disabled', !enabled);
                    if (enabled) { $confirmBtn.removeAttr('aria-disabled'); } else { $confirmBtn.attr('aria-disabled', 'true'); }
                }

                $requiredChecks.add($requiredMaster).on('change', function () {
                    setTimeout(syncConfirmBtn, 0);
                });

                syncConfirmBtn();
            });
        </script>
    </body>
</html>
